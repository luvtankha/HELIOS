packages:
  - "apps/*"
  - "packages/*"

overrides:
  "brace-expansion@<2": ^1.1.21
  "brace-expansion@>=5 <6": ^5.0.12
  postcss: ^8.5.28
  deepmerge-ts: ^8.0.0

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "esbuild"
  - "prisma"
  - "sharp"
  - "tesseract.js"
  - "unrs-resolver"
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  tesseract.js: true
  unrs-resolver: true
